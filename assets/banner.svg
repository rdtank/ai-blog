<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="AI Blog — AI-powered summaries and grounded Q&amp;A, streamed in real time">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1A1640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow1)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>

  <!-- Left: title block -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="88" fill="#67E8F9" font-size="18" font-weight="600" letter-spacing="3">FULL-STACK · AI · STREAMING</text>

    <text x="70" y="174" font-size="84" font-weight="800" letter-spacing="-1">
      <tspan fill="url(#accent)">AI</tspan><tspan fill="#F8FAFC"> Blog</tspan>
    </text>

    <text x="72" y="216" fill="#94A3B8" font-size="23" font-weight="400">AI summaries &amp; grounded Q&amp;A, streamed token-by-token.</text>

    <!-- Tech pills -->
    <g transform="translate(72,248)" font-size="15" fill="#CBD5E1" text-anchor="middle">
      <g>
        <rect x="0" y="0" width="92" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="46" y="21">React 19</text>
      </g>
      <g>
        <rect x="104" y="0" width="104" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="156" y="21">Express 5</text>
      </g>
      <g>
        <rect x="220" y="0" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="262" y="21">Gemini</text>
      </g>
      <g>
        <rect x="316" y="0" width="60" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="346" y="21">SSE</text>
      </g>
      <g>
        <rect x="388" y="0" width="112" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <text x="444" y="21">Tailwind v4</text>
      </g>
    </g>
  </g>

  <!-- Right: streaming summary card mock -->
  <g transform="translate(812,66)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect width="320" height="208" rx="16" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="30" cy="36" r="11" fill="url(#accent)"/>
    <text x="52" y="42" fill="#E2E8F0" font-size="16" font-weight="600">AI Summary</text>

    <rect x="24" y="70" width="272" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.16"/>
    <rect x="24" y="96" width="248" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="24" y="122" width="206" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="24" y="148" width="118" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.12"/>
    <rect x="148" y="147" width="8" height="14" rx="2" fill="url(#accent)"/>

    <rect x="24" y="176" width="150" height="18" rx="9" fill="url(#accent)" fill-opacity="0.18"/>
    <text x="40" y="189" fill="#67E8F9" font-size="12" font-weight="600">✨ streaming…</text>
  </g>
</svg>
